services:

  app:
    build: .
    container_name: fmr-map
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "8080:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/years"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fmr-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web

networks:
  web:
    driver: bridge
